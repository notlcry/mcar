[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcar-modules"
version = "0.1.0"
description = "mcar Agent robot system - Python hardware modules"
requires-python = ">=3.11"
dependencies = [
    "pyzmq>=26.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]
hw = [
    "RPi.GPIO>=0.7.0",
    "smbus2>=0.5.0",
]
voice = [
    "SpeechRecognition>=3.10.0",
    "edge-tts>=6.1.0",
    "pvporcupine>=3.0.0",
    "pygame>=2.5.0",
    "pyaudio>=0.2.14",
]
display = [
    "luma.oled>=3.13.0",
    "Pillow>=10.0.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["common", "mock", "voice", "motion", "sensor", "display", "button"]
exclude = ["tests", "tests.*", "template", "template.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
