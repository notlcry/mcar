[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcar-modules"
version = "0.1.0"
description = "mcar Agent robot system - Python hardware modules"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "jsonschema>=4.23.0",
    "pydantic>=2.9.0",
    "pydantic-ai-slim[anthropic,google,openai]>=1.0.0",
    "pyzmq>=26.0.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]
hw = [
    "RPi.GPIO>=0.7.0",
    "smbus2>=0.5.0",
]
voice = [
    "alibaba-nls-python-sdk>=1.0.2",
    "dashscope>=1.23.1",
    "SpeechRecognition>=3.10.0",
    "edge-tts>=6.1.0",
    "openwakeword>=0.6.0",
    "pvporcupine>=3.0.0",
    "pygame>=2.5.0",
    "pyaudio>=0.2.14",
]
qwen3-asr-server = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "qwen-asr>=0.0.6",
    "uvicorn>=0.32.0",
]
display = [
    "luma.oled>=3.13.0",
    "Pillow>=10.0.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["common", "mock", "voice", "motion", "sensor", "display", "button", "robot_service"]
exclude = ["tests", "tests.*", "template", "template.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
